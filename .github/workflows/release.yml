name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify tag matches extension version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          desc="$(grep -oP '<version value="\K[^"]+' src/description.xml)"
          init="$(grep -oP '__version__ = "\K[^"]+' src/python/pythonpath/mlo/__init__.py)"
          feed="$(grep -oP '<version value="\K[^"]+' update.xml)"
          echo "tag=$tag  description.xml=$desc  __init__.py=$init  update.xml=$feed"
          if [ "$tag" != "$desc" ] || [ "$tag" != "$init" ] || [ "$tag" != "$feed" ]; then
            echo "::error::Tag $tag must match the version in description.xml ($desc), mlo/__init__.py ($init) and update.xml ($feed). Bump all three before tagging." >&2
            exit 1
          fi
          # The update feed must offer the asset this run is about to
          # publish, or Check for Updates would hand users a dead link.
          want="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/mendeley-libreoffice-${tag}.oxt"
          if ! grep -qF "$want" update.xml; then
            echo "::error::update.xml must point its download at $want" >&2
            exit 1
          fi

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Build extension
        run: |
          ./build.sh
          version="${GITHUB_REF_NAME#v}"
          cp dist/mendeley-libreoffice.oxt "dist/mendeley-libreoffice-${version}.oxt"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/mendeley-libreoffice-${version}.oxt" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
