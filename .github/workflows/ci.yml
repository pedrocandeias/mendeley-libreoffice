name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Render sample bibliography (smoke check)
        run: python3 scripts/demo.py

      - name: Build extension
        run: ./build.sh

      - name: Upload .oxt artifact
        uses: actions/upload-artifact@v4
        with:
          name: mendeley-libreoffice-oxt
          path: dist/mendeley-libreoffice.oxt
          if-no-files-found: error

  uno:
    # Integration tests for the UNO layer (document.py, the protocol
    # handler and the Word importer), which the unit tests cannot reach.
    # Installs the built .oxt into a throwaway profile and drives a
    # headless LibreOffice over a UNO socket.
    name: UNO integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TODO: drop continue-on-error once this job has proven stable
    # (it drives a real LibreOffice, so it is the most likely to flake).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice and python3-uno
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer python3-uno zip

      - name: Run UNO integration tests
        run: ./scripts/run_uno_tests.sh
